#
# Check-build of tuner-core in the freedesktop 26.08 SDK (the platform the app ships on): the SDK is already in the
# container image, so only libgee is built (and cached). Runs the headless tests and the core-boundary check.
# Runs when Vala sources, the tests or the build files change (and by hand from the Actions tab).

name: CI

on:
  push:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'tests/**'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'data/*.gschema.xml'
      - 'scripts/check_core_boundary.py'
      - 'scripts/core_boundary_baseline.txt'
      - '.github/flatpak/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'tests/**'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'data/*.gschema.xml'
      - 'scripts/check_core_boundary.py'
      - 'scripts/core_boundary_baseline.txt'
      - '.github/flatpak/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (freedesktop 26.08)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build and test
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: .github/flatpak/io.github.tuner_labs.tuner.core.ci.yml
          cache-key: flatpak-builder-core-${{ hashFiles('.github/flatpak/*.yml') }}
          run-tests: true
          build-bundle: false
          upload-artifact: false
