#
# Check-build of tuner-core: configure, compile and run the headless tests and the core-boundary check.
# Runs when Vala sources, the tests or the build files change (and by hand from the Actions tab).
# The packages are the ones scripts/check-build.sh needs on a developer machine (Ubuntu 24.04 / Mint 22).

name: CI

on:
  push:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'tests/**'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'data/*.gschema.xml'
      - 'scripts/check_core_boundary.py'
      - 'scripts/core_boundary_baseline.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'tests/**'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'data/*.gschema.xml'
      - 'scripts/check_core_boundary.py'
      - 'scripts/core_boundary_baseline.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac meson ninja-build pkg-config gettext python3 libglib2.0-bin \
            libglib2.0-dev libgee-0.8-dev libgstreamer1.0-dev \
            libsoup-3.0-dev libjson-glib-dev

      - name: Configure
        run: meson setup build --buildtype=debug

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-logs/
